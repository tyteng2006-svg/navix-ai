
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAVIX AI</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial}
header{padding:18px;background:#172633;display:flex;justify-content:space-between}
.logo{font-size:24px;font-weight:bold;color:#42e8b4}
#map{height:65vh;width:100%}
.panel{padding:16px;background:#172633}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#20c997;font-size:16px;font-weight:bold}
#info{margin-top:12px;font-size:13px;line-height:1.8;color:#c5d3dc}
footer{text-align:center;padding:12px;color:#8295a3;font-size:12px}
</style>
</head>
<body>
<header>
<div class="logo">NAVIX AI</div>
<div>● ONLINE</div>
</header>

<div id="map"></div>

<div class="panel">
<button onclick="locateMe()">📍 定位我的位置</button>
<div id="info">欢迎使用 NAVIX AI<br>智能导航系统准备就绪</div>
</div>

<footer>NAVIX AI © 2026 | Malaysia Intelligent Navigation</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([1.4927,103.7414],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19,
attribution:'© OpenStreetMap'
}).addTo(map);

let marker;

function locateMe(){
const info=document.getElementById('info');

if(!navigator.geolocation){
info.innerText='浏览器不支持定位';
return;
}

info.innerText='正在获取 GPS 位置...';

navigator.geolocation.getCurrentPosition(
p=>{
const lat=p.coords.latitude;
const lng=p.coords.longitude;

map.setView([lat,lng],17);

if(marker)map.removeLayer(marker);

marker=L.marker([lat,lng]).addTo(map)
.bindPopup('NAVIX AI：当前位置').openPopup();

info.innerHTML='GPS 定位成功！<br>纬度：'+lat.toFixed(6)+
'<br>经度：'+lng.toFixed(6)+
'<br>精度：'+Math.round(p.coords.accuracy)+' 米';
},
e=>{
info.innerText='定位失败，请检查手机 GPS 和网站定位权限。';
},
{enableHighAccuracy:true,timeout:15000}
);
}
</script>
</body>
</html>
